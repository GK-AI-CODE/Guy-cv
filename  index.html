<style>
:root{
  --sheet:#FBFBF9;
  --ink:#142A40;
  --ink-soft:#55626E;
  --rule:#CBD3DA;
  --rule-strong:#9DA9B4;
  --accent:#A9762F;
  --redline:#8C3A1B;
  --pass:#2E6B4F;
  --maxw:74ch;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--sheet);
  color:var(--ink);
  font-family:'Heebo',-apple-system,Segoe UI,Arial,sans-serif;
  font-weight:400;
  font-size:17px;
  line-height:1.62;
  padding:clamp(10px,2.2vw,26px);
}

/* ---- drawing sheet frame ---- */
.sheet{
  max-width:960px;margin:0 auto;position:relative;
  border:1px solid var(--rule-strong);
  background:#fff;
  padding:clamp(20px,4.4vw,56px);
  padding-bottom:0;
}
.sheet::before{
  content:"";position:absolute;inset:7px;
  border:1px solid var(--rule);pointer-events:none;
}
.inner{position:relative;max-width:var(--maxw)}

/* ---- language switch ---- */
.lang{
  position:absolute;top:0;inset-inline-end:0;
  display:flex;border:1px solid var(--rule-strong);
  font-size:12px;letter-spacing:.09em;z-index:5;
}
.lang button{
  font:inherit;font-family:inherit;font-weight:500;
  background:transparent;border:0;color:var(--ink-soft);
  padding:6px 13px;cursor:pointer;letter-spacing:.09em;
}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lang button+button{border-inline-start:1px solid var(--rule-strong)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---- hero ---- */
.hero{padding-block:8px 4px}
h1{
  font-weight:900;letter-spacing:-.022em;line-height:.97;
  font-size:clamp(44px,9.2vw,86px);
}
.role{
  margin-top:10px;font-weight:500;font-size:clamp(15px,2.3vw,19px);
  color:var(--accent);letter-spacing:.005em;
}

/* the one bold moment: his record, dimensioned like a part */
.dimwrap{margin:22px 0 6px}
svg.dim{display:block;width:100%;height:46px;overflow:visible}
svg.dim line,svg.dim path{stroke:var(--rule-strong);stroke-width:1;fill:none}
svg.dim .span{stroke:var(--accent);stroke-width:1.3}
svg.dim text{
  font-family:'Heebo',Arial,sans-serif;font-size:12.5px;font-weight:500;
  fill:var(--accent);letter-spacing:.04em;
}
@media(prefers-reduced-motion:no-preference){
  .anim svg.dim .span,.anim svg.dim .tick{
    stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
    animation:draw .85s cubic-bezier(.4,0,.15,1) .25s forwards;
  }
  .anim svg.dim text{opacity:0;animation:fade .5s ease .95s forwards}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

#dimlabel{
  margin-top:-33px;margin-inline:auto;
  display:table;background:#fff;padding:0 14px;
  font-size:12.5px;font-weight:500;letter-spacing:.04em;
  color:var(--accent);text-align:center;position:relative;
}
@media(prefers-reduced-motion:no-preference){
  .anim #dimlabel{opacity:0;animation:fade .5s ease .95s forwards}
}
@media(max-width:520px){#dimlabel{font-size:11.5px;padding:0 8px}}

.meta{
  display:flex;flex-wrap:wrap;gap:6px 20px;
  font-size:14.5px;color:var(--ink-soft);
  padding-block:6px 4px;
}
.meta a{color:var(--ink-soft);text-decoration-color:var(--rule-strong);text-underline-offset:3px}
.meta a:hover{color:var(--accent)}

/* ---- sections ---- */
section{padding-block:clamp(26px,4vw,40px) 0}
h2{
  font-size:13.5px;font-weight:700;letter-spacing:.14em;
  color:var(--ink);padding-bottom:7px;margin-bottom:18px;
  border-bottom:1.5px solid var(--accent);
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
}
h2 .zone{font-weight:400;font-size:11px;letter-spacing:.1em;color:var(--ink-soft)}
p.lede{font-size:17.5px;line-height:1.68}

/* ---- inspection record (achievements) ---- */
table.rec{width:100%;border-collapse:collapse;font-size:15.5px}
table.rec th{
  text-align:start;font-weight:500;font-size:11.5px;letter-spacing:.1em;
  color:var(--ink-soft);border-bottom:1px solid var(--rule-strong);
  padding:0 10px 7px 0;padding-inline:0 10px;
}
table.rec td{
  padding:11px 10px 11px 0;padding-inline:0 10px;
  border-bottom:1px solid var(--rule);vertical-align:baseline;
}
table.rec tr:last-child td{border-bottom:0}
td.val{
  font-weight:900;font-size:19px;color:var(--accent);
  white-space:nowrap;width:1%;
}
td.what{font-weight:500}
td.how{color:var(--ink-soft);font-size:14.5px;line-height:1.5}

/* ---- experience ---- */
.job{padding-bottom:20px}
.job:last-child{padding-bottom:4px}
.job h3{font-size:18px;font-weight:700;line-height:1.3}
.job .at{
  font-size:14.5px;color:var(--ink-soft);margin:2px 0 9px;
}
.job .at b{color:var(--accent);font-weight:500}
ul{list-style:none}
ul li{position:relative;padding-inline-start:17px;margin-bottom:6px}
ul li::before{
  content:"";position:absolute;inset-inline-start:0;top:.72em;
  width:6px;height:1.5px;background:var(--accent);
}

/* ---- projects ---- */
.proj{
  padding:14px 0;border-top:1px solid var(--rule);
}
.proj:first-of-type{border-top:0;padding-top:2px}
.proj h3{font-size:16.5px;font-weight:700}
.proj p{font-size:15.5px;margin:3px 0 7px}
.stack{font-size:12.5px;color:var(--ink-soft);letter-spacing:.03em}

/* ---- education / service grid ---- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:620px){.two{grid-template-columns:1fr;gap:0}}
.ed{margin-bottom:13px}
.ed b{font-weight:700;font-size:15.5px}
.ed span{display:block;font-size:14px;color:var(--ink-soft)}

/* ---- title block (drawing convention) ---- */
.titleblock{
  margin-top:clamp(30px,5vw,46px);
  margin-inline:calc(-1 * clamp(20px,4.4vw,56px));
  border-top:1.5px solid var(--ink);
  display:grid;grid-template-columns:repeat(4,1fr);
}
.titleblock div{
  padding:11px clamp(10px,2vw,16px);
  border-inline-end:1px solid var(--rule);
  font-size:13px;
}
.titleblock div:last-child{border-inline-end:0}
.titleblock dt{
  font-size:10px;letter-spacing:.12em;color:var(--ink-soft);
  font-weight:500;margin-bottom:2px;
}
.titleblock dd{font-weight:700;font-size:13.5px}
.titleblock a{color:var(--ink);text-decoration-color:var(--accent);text-underline-offset:3px}
.titleblock a:hover{color:var(--accent)}
@media(max-width:620px){
  .titleblock{grid-template-columns:1fr 1fr}
  .titleblock div:nth-child(2n){border-inline-end:0}
  .titleblock div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
}

/* ---- download bar ---- */
.dl{
  display:flex;flex-wrap:wrap;gap:10px;
  margin-top:20px;
}
.dl a{
  font-size:13.5px;font-weight:500;letter-spacing:.03em;
  color:var(--ink);text-decoration:none;
  border:1px solid var(--rule-strong);
  padding:8px 15px;
}
.dl a:hover{border-color:var(--accent);color:var(--accent)}
.dl a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- print: give recruiters a clean sheet on Ctrl+P ---- */
@media print{
  body{padding:0;font-size:10.5pt}
  .sheet{border:0;padding:0;max-width:none}
  .sheet::before,.lang,.dl{display:none}
  .titleblock{margin-inline:0;page-break-inside:avoid}
  section,.job,.proj{page-break-inside:avoid}
  h1{font-size:32pt}
  a{text-decoration:none;color:var(--ink)}
}
</style>

  }
};

const $ = id => document.getElementById(id);

function render(k){
  const d = DATA[k];
  document.documentElement.lang = d.lang;
  document.documentElement.dir  = d.dir;
  document.title = d.name + " — " + (k==="he" ? "מנהל פרויקטים" : "Project Manager");

  $("name").textContent = d.name;
  $("role").textContent = d.role;
  $("dimlabel").textContent = d.dim;

  $("meta").innerHTML = d.meta.map(m =>
    m.h ? `<a href="${m.h}">${m.t}</a>` : `<span>${m.t}</span>`).join("");

  $("h-sum").textContent  = d.h.sum;
  $("h-rec").textContent  = d.h.rec;
  $("h-exp").textContent  = d.h.exp;
  $("h-proj").textContent = d.h.proj;
  $("h-skl").textContent  = d.h.skl;
  $("h-edu").textContent  = d.h.edu;

  $("summary").textContent = d.summary;

  $("th-val").textContent  = d.th[0];
  $("th-what").textContent = d.th[1];
  $("th-how").textContent  = d.th[2];
  $("records").innerHTML = d.records.map(r =>
    `<tr><td class="val">${r[0]}</td><td class="what">${r[1]}</td><td class="how">${r[2]}</td></tr>`).join("");

  $("jobs").innerHTML = d.jobs.map(j => `
    <div class="job">
      <h3>${j.t}</h3>
      <div class="at"><b>${j.c}</b> &nbsp;·&nbsp; ${j.d}</div>
      <ul>${j.b.map(b=>`<li>${b}</li>`).join("")}</ul>
    </div>`).join("");

  $("projects").innerHTML = d.projects.map(p => `
    <div class="proj">
      <h3>${p.t}</h3>
      <p>${p.d}</p>
      <div class="stack">${p.s}</div>
    </div>`).join("");

  $("skills").innerHTML = d.skills.map(s => `
    <div class="ed"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");

  $("education").innerHTML =
    `<div class="ed"><b>${d.eduLabel}</b></div>` +
    d.education.map(e=>`<div class="ed"><b>${e.d}</b><span>${e.s}</span></div>`).join("");
  $("service").innerHTML =
    `<div class="ed"><b>${d.svcLabel}</b><span>${d.service}</span></div>`;

  $("downloads").innerHTML = d.downloads.map(x =>
    `<a href="${x[1]}" download>${x[0]}</a>`).join("");

  $("titleblock").innerHTML = d.block.map(b => {
    let val = b[1];
    if (val.includes("@")) val = `<a href="mailto:${val}">${val}</a>`;
    else if (val.includes("github.io")) val = `<a href="https://${val}/" target="_blank" rel="noopener">${val}</a>`;
    return `<div><dt>${b[0]}</dt><dd>${val}</dd></div>`;
  }).join("");

  $("btnEn").setAttribute("aria-pressed", k==="en");
  $("btnHe").setAttribute("aria-pressed", k==="he");
  try{ localStorage.setItem("cvlang", k); }catch(e){}
}

$("btnEn").addEventListener("click", ()=>render("en"));
$("btnHe").addEventListener("click", ()=>render("he"));

let start = "en";
try{
  const saved = localStorage.getItem("cvlang");
  if(saved) start = saved;
  else if((navigator.language||"").toLowerCase().startsWith("he")) start = "he";
}catch(e){}
render(start);

// the dimension line draws once, on load, then stops
window.addEventListener("load", ()=>{
  setTimeout(()=>$("dimwrap").classList.remove("anim"), 2200);
});
</script>
</body>
</html>
